# Builds the browser version of the client (WebAssembly) and publishes it to
# the "navegador" release: index.html, otclient.js, otclient.wasm,
# otclient.data and versao.txt (the commit it was built from). The VPS takes
# it from there (tools/deploy/ativar-navegador.sh in the server repository,
# also run by every server update) and serves it at https://<site>/jogar.
name: Navegador

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "modules/**"
      - "mods/**"
      - "data/**"
      - "browser/**"
      - "init.lua"
      - "config.ini"
      - "CMakeLists.txt"
      - "vcpkg.json"
      - ".github/workflows/navegador.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: navegador
  cancel-in-progress: true

env:
  # the versions the browser build was tested with
  EMSDK_VERSION: 6.0.13
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build autoconf autoconf-archive automake libtool pkg-config
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout -q "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      # the WebAssembly libraries take most of the build: kept between runs
      - name: Restore the built libraries
        id: libs
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-wasm-${{ env.EMSDK_VERSION }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'browser/triplets/**', 'browser/overlay-ports/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-wasm-${{ env.EMSDK_VERSION }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'browser/triplets/**', 'browser/overlay-ports/**') }}-
            vcpkg-wasm-${{ env.EMSDK_VERSION }}-${{ env.VCPKG_COMMIT }}-

      - name: Configure
        id: configure
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake -G Ninja -S . -B build-emscripten \
            -DWASM=ON \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=wasm32-emscripten-pthread \
            -DVCPKG_HOST_TRIPLET=x64-linux \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/browser/triplets" \
            -DVCPKG_OVERLAY_PORTS="$PWD/browser/overlay-ports" \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build \
            -DWASM_USE_WASM_EXCEPTIONS=OFF \
            -DOPTIONS_ENABLE_IPO=OFF \
            -DTOGGLE_BIN_FOLDER=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_C_FLAGS="-pthread -matomics -mbulk-memory -fno-lto" \
            -DCMAKE_CXX_FLAGS="-pthread -matomics -mbulk-memory -fno-lto -std=c++20 -D_LIBCPP_DISABLE_AVAILABILITY -fexperimental-library" \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread -matomics -mbulk-memory -s ALLOW_MEMORY_GROWTH=0 -s INITIAL_MEMORY=1073741824 -s USE_PTHREADS=1 -s PTHREAD_POOL_SIZE=4 -s WASM=1 -s NO_EXIT_RUNTIME=1 -fno-lto" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG -fno-lto" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF

      # saved as soon as they are built (vcpkg stores each one when it is
      # done), even when a library or the client build fails later
      - name: Save the built libraries
        if: always() && steps.configure.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.libs.outputs.cache-primary-key }}

      - name: Build
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --build build-emscripten --target otclient -j"$(nproc)"

      - name: Package
        run: |
          mkdir out
          cp build-emscripten/bin/otclient.html out/index.html
          cp build-emscripten/bin/otclient.js build-emscripten/bin/otclient.wasm build-emscripten/bin/otclient.data out/
          echo "$GITHUB_SHA" > out/versao.txt
          ls -la out

      - name: Publish to the navegador release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view navegador >/dev/null 2>&1; then
            gh release create navegador --prerelease --latest=false --title "Jogo no navegador" \
              --notes "Versao do cliente para navegador, refeita a cada mudanca no cliente. A VPS baixa daqui (tools/deploy/ativar-navegador.sh)."
          fi
          # versao.txt last: the VPS reads it to know there is a new build
          gh release upload navegador out/index.html out/otclient.js out/otclient.wasm out/otclient.data --clobber
          gh release upload navegador out/versao.txt --clobber
