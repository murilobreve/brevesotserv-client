<style>
    /* ==============================================================================================
       UTILITIES & SHARED CLASSES
       ============================================================================================== */
    /* Layout Helpers */
    .flex { display: flex; }
    .block { display: block; }
    .inlineBlock { display: inline-block; }
    .fullWidth { width: 100%; }
    
    /* Typography */
    .fontText { font: verdana-11px-antialised; }
    .fontTitle { font: verdana-11px-rounded; }
    
    /* Color Palette */
    .colorGrey { color: #cccccc; }
    .colorWhite { color: #ffffff; }
    .colorLightGrey { color: #aaaaaa; }
    .colorItemGrey { color: #c0c0c0; }
    .bgDark { background: #222222; }
    
    /* Borders & Box Models */
    .iconBox { width: 40px; height: 40px; flex-shrink: 0; min-width: 40px; --virtual: true}
    .borderGrey { border: 1 #444444; }
    .sunkenBorder { --border-width-top: 1; --border-color-top: #141414; --border-width-left: 1; --border-color-left: #141414; --border-width-bottom: 1; --border-color-bottom: #747474; --border-width-right: 1; --border-color-right: #747474; }
    .panelBase { width: 345px; display: block; margin-left: 15px; }
    .windowBtn { width: 12px; height: 12px; --image-source: /images/ui/miniwindow_buttons; --image-size: 14 14; margin-top: 7px; }

    /* ==============================================================================================
       MAIN WINDOW & STRUCTURE
       ============================================================================================== */
    .modal-message { width: 400px; height: 400px; display: block; --image-source: /images/ui/window_new; --image-border: 6; --image-border-top: 27; }
    .leftPanel {width: 395px; height: 400px; float: left;}
    .rightPanel { width: 240px; height: 366px; margin-top: 30px; margin-left: 12px; float: left;}
    .verticalSep { height: 340px; margin-top: 25px; float: left;  margin-left: -10px;}
    .dragHandle { height: 27px; background-color: alpha; }
    .closeButton { --image-clip: 28 0 14 14; margin-right: 10px; }
    .closeButton:hover { --image-clip: 28 14 14 14; }
    .closeButton:active { --image-clip: 28 28 14 14; }
    .bottonOptions { --image-clip: 112 0 14 14; margin-right: 25px; }
    .bottonOptions:hover { --image-clip: 112 14 14 14; }
    .bottonOptions:active { --image-clip: 112 28 14 14; }

    /* ==============================================================================================
       NPC INTERACTION (LEFT PANEL)
       ============================================================================================== */
    /* Header & Visuals */
    .img { width: 186px; height: 27px; }
    .title { margin-left: 90px; margin-top: 8px; display: block; width: 75%; }
    .podium { width: 65px; height: 67px; margin-left: 10px; }
    .creature-display { width: 64px; height: 64px; margin-left: 10px; margin-top: 10px; }

    /* Chat & Console */
    .panelConsole { margin-top: 80px; --image-border: 4; padding: 1; padding-right: 12; padding-left: 4; padding-top: 4; padding-bottom: 4; height: 238px; --image-source: /images/ui/3pixel_frame_borderimage; }
    .inputConsole { margin-bottom: 10px; display: inline-block; width: 288px; margin-left: 15px; margin-top: 5px; --placeholder: "Type here to chat"; --placeholder-color: #6E706F}
    .bottonChat { display: inline; margin-left: 308px; margin-bottom: 10px; font: cipsoftFont; }
    
    /* Buttons Panel */
    .panelBotons {height: 35px;  margin-bottom: 39px; --focusable: false; width: 100%; margin-left: 15px;}
    .npc-button { width: 19px; height: 19px; --icon-source: /game_npctrade/assets/images/icons-npcdialog; margin-right: 2px; }

    /* ==============================================================================================
       TRADE INTERFACE (RIGHT PANEL)
       Baiak Mythicum: stone panel, gold for money, white for names
       ============================================================================================== */
    /* Tabs */
    .tradeTabs { height: 22px; width: 100%; }
    .tradeTab { width: 50%; height: -3px; font: verdana-11px-rounded; color: #9a9a9a; }
    .tradeTabActive { color: #f2c94c; }

    /* Search Bar */
    .tradeSearchRow { height: 20px; margin-top: 5px; }
    .tradeSearchInput { --placeholder: "Search"; --placeholder-color: #6E706F; width: 100%; display: block; float: left; font: verdana-11px-antialised; }
    .tradeSearchClear { --image-source: /game_cyclopedia/images/button_clear_search; float: right; margin-right: 3px; margin-top: 2px; }

    /* Item List */
    .tradeListScroll { height: 196px; margin-top: 5px; background-color: #2b2b2b; overflow: scroll; }
    .tradeListItem { height: 40px; padding: 3 4; border: 1 transparent; }
    .tradeListItem:nth-child(odd) { background-color: #323232; }
    .tradeListItem:hover { background-color: #3d3d3d; }
    .tradeListItem:focus { background-color: #4a3d1c; border: 1 #a8842c; }
    .tradeListItemSelected { background-color: #4a3d1c; border: 1 #a8842c; }
    .itemIcon { width: 34px; height: 34px; flex-shrink: 0; min-width: 34px; }
    .itemInfoBlock { display: block; margin-left: 6px; width: 166px; overflow: hidden; }
    .tradeItemName { display: block; width: 100%; font: verdana-11px-antialised; color: #e8e8e8; margin-top: 2px; }
    .tradeItemLine { width: 100%; height: 14px; margin-top: 3px; }
    .tradeItemPrice { font: verdana-11px-antialised; color: #f2c94c; width: 78px; }
    .tradeItemSide { font: verdana-11px-antialised; color: #8c8c8c; width: 86px; text-align: right; }

    /* Footer */
    .tradeFooter { margin-top: 6px; }
    #amountScrollBar { width: 238px; }
    .tradeRow { height: 16px; margin-top: 3px; }
    .tradeFooterLabel { width: 80px; font: verdana-11px-antialised; color: #a8a8a8; float: left; }
    .tradeFooterValue { width: 130px; float: right; text-align: right; font: verdana-11px-antialised; color: #e8e8e8; }
    .tradeTotalValue { font: verdana-11px-rounded; color: #f2c94c; }
    .tradeFooterAmountInput { width: 70px; height: 16px; float: right; text-align: right; padding-right: 3px; font: verdana-11px-antialised; }
    .tradeCurrencyIcon { width: 16px; height: 16px; float: left; margin-right: 4px; }
    .tradeCurrencyName { font: verdana-11px-antialised; color: #a8a8a8; float: left; }
    .tradeButtons { height: 24px; margin-top: 8px; }
    .tradeBuyButton { width: 96px; height: -3px; float: right; font: verdana-11px-rounded; color: #ffffff; }
    .sellLootButton { width: 96px; height: -3px; float: left; font: verdana-11px-rounded; color: #f2c94c; }
</style>


<script type="text">
    self.isTradeOpen = false;
    self.tradeItems = {};
    self.selectedItem = nil;
    self.amount = 1;
    self.totalPrice = 0;
    self.totalWeight = "0.00";
</script>

<html>
<uiwindow id="windowTrader" placement="center" *width="self.widthConsole" class="modal-message"
    src="images/ui/miniwindow" onescape="self:onCloseNpcTrade()" onkeydown="self:onConsoleKeyPress(event)">

    <!-- Left Panel -->
    <div class="leftPanel" >
        <scrollablepanel id="consoleBuffer" inverted-scroll="true" always-scroll-maximum="true" class="panelConsole panelBase" style="overflow: scroll; padding: 4px;" layout="type: verticalBox; align-bottom: true" placement="top-left">
        </scrollablepanel>

        <img class="img" src="assets/images/blue-golden-flag-banner" placement="top-left" />
        <label class="title" placement="top-left">{{self.creatureName}}</label>
        <img class="podium" src="assets/images/backdrop-npcdialog-podestal" placement="top-left" />
        <uicreature id="creatureOutfit" class="creature-display" placement="top-left"></uicreature>


        <div id="panelBotons" placement="bottom-left" class="panelBotons">
            <button *for="local buttonData in self.buttons" class="npc-button" *tooltip="buttonData.text"
                *icon-clip="self:getIconClip(buttonData.id)" onclick="self:onConsoleTextClicked(buttonData.text)">

            </button>
        </div>
        <input id="chatInput" class="inputConsole" placement="bottom-left" />
        <button id="chatModeButton" class="bottonChat" placement="bottom-left" onclick="self:toggleChatMode()">{{self.chatMode}}</button>
    </div>

    <div class="verticalSep VerticalSeparator" *visible="self.isTradeOpen"></div>

    <!-- Right Panel (Trade) -->
    <div class="rightPanel" *visible="self.isTradeOpen">
        <!-- Buy / Sell -->
        <div class="tradeTabs flex">
            <button id="tabBuy" class="tradeTab" text="Buy" *class-tradeTabActive="self.tradeMode == self.BUY" onclick="self:setTradeMode(self.BUY)"></button>
            <button id="tabSell" class="tradeTab" text="Sell" *class-tradeTabActive="self.tradeMode == self.SELL" onclick="self:setTradeMode(self.SELL)"></button>
        </div>

        <!-- Search -->
        <div class="tradeSearchRow borderGrey bgDark">
            <input class="tradeSearchInput colorLightGrey" onchange="self:filterTradeList(event.value)"/>
            <uibutton class="tradeSearchClear" onclick="self:clearSearch()"></uibutton>
        </div>

        <!-- List -->
        <div id="tradeListScroll" class="tradeListScroll fullWidth sunkenBorder" layout="type: verticalBox">
            <div *for="local item in self.tradeItems" *for-finished="self:onTradeListRendered()" class="tradeListItem flex fullWidth"
                *trade-item="item"
                *class-tradeListItemSelected="self.selectedItem == item">
                <UIItem class="itemIcon item" *item="item.ptr" />
                <div class="itemInfoBlock">
                    <label id="nameLabel" class="tradeItemName" *text="self:displayName(item)"></label>
                    <div class="tradeItemLine flex">
                        <label id="infoLabel" class="tradeItemPrice" *text="self:formatGold(item.price) .. ' gp'"></label>
                        <label id="sideLabel" class="tradeItemSide" *text="self:sideText(item)"></label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="tradeFooter">
            <HorizontalScrollBar id="amountScrollBar" minimum="1" maximum="100" step="1"
                onchange="self:onAmountScrollBarChange(event.value)" disabled />

            <div class="tradeRow">
                <label class="tradeFooterLabel" text="Amount"></label>
                <input id="amountInput" class="tradeFooterAmountInput colorWhite bgDark borderGrey" *text="self.amount" onchange="self:onAmountInputChange(event)" />
            </div>
            <div class="tradeRow">
                <label class="tradeFooterLabel" text="Total"></label>
                <label class="tradeFooterValue tradeTotalValue" *text="self:formatGold(self.totalPrice) .. ' gp'"></label>
            </div>
            <div class="tradeRow">
                <UIItem class="tradeCurrencyIcon" item-id="3031" item-count="1" />
                <label class="tradeCurrencyName" text="Gold Coin"></label>
                <label id="playerMoneyDisplay" class="tradeFooterValue" text="0"></label>
            </div>

            <div class="tradeButtons">
                <!-- Baiak Mythicum: sells everything the NPC buys from every bag in one go -->
                <button id="sellLootButton" class="sellLootButton" text="Sell all"
                    *visible="self.tradeMode == self.SELL"
                    tooltip="Sells everything in your bags that this NPC buys. Equipped items, rarity items, tools and the supplies this NPC sells are kept."
                    onclick="self:confirmSellLoot()"></button>
                <button id="toggleButton" class="tradeBuyButton" text="Buy" onclick="self:executeTrade()"></button>
            </div>
        </div>
    </div>

    <div id="dragHandle" class="dragHandle" placement="top-left" *width="self.widthConsole" focusable="false"></div>

    <UIButton class="bottonOptions windowBtn" placement="top-right" *visible="self.isTradeOpen" onclick="self:onOptionsClick()"></UIButton>
    <UIButton class="closeButton windowBtn" placement="top-right" onclick="self:onCloseNpcTrade()"></UIButton>

</uiwindow>

</html>
