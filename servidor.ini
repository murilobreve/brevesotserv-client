; =====================================================================
;  Baiak Breves - endereco do servidor
; =====================================================================
;  Para trocar o IP: mude a linha "ip" abaixo, salve e abra o client.
;  Nao precisa recompilar nada. Pode ser um IP ou um dominio.
;
;  ip          : IP ou dominio da maquina onde roda o site (login.php)
;  porta_login : porta HTTP do site onde fica o login.php (normalmente 80)
;  site        : endereco do site (botao "Criar conta" e "Esqueci a senha")
;                se ficar vazio, usa http://<ip>
;
;  HTTPS: se o site tiver certificado (dominio com https), use
;  "ip = https://seu-dominio" e "porta_login = 443" para o login (conta
;  e senha) ir criptografado. Sem https:// o login vai em HTTP comum.
; =====================================================================

