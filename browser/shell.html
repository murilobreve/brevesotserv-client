<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <title>Mythos</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        background-color: black;
        overscroll-behavior: contain;
      }
      .backbuffer {
        position: absolute;
        top: 0px;
        left: 0px;
        margin: 0px;
        border: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: block;
        image-rendering: optimizeSpeed;
        image-rendering: -moz-crisp-edges;
        image-rendering: -o-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: optimize-contrast;
        image-rendering: crisp-edges;
        -ms-interpolation-mode: nearest-neighbor;
      }
      .title {
        pointer-events: none;
        position: absolute;
        top: 10px;
        margin-top: 0px;
        padding-left: 10px;
        color: white;
        text-decoration: none;
        z-index: 1;
        text-align: left;
        font-family: "Roboto", Helvetica, sans-serif;
        font-size: 20px;
        outline: none;
        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10 and IE 11 */
        user-select: none; /* Standard syntax */
      }
      .notice {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 4;
        max-width: min(640px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 10px 40px 10px 14px;
        border-radius: 6px;
        background: rgba(20, 16, 32, 0.92);
        border: 1px solid #b08a3c;
        color: #f2e6c9;
        font: 14px/1.45 Helvetica, Arial, sans-serif;
      }
      .notice[hidden] {
        display: none;
      }
      .notice button {
        position: absolute;
        top: 6px;
        right: 8px;
        border: 0;
        background: none;
        color: inherit;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
      }
      #start {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 3;
        font-size: 2rem;
        display: none;
      }
    </style>
  </head>
  <body>
    <div
      class="title"
      id="title-text"
      contenteditable
      virtualkeyboardpolicy="manual"
    ></div>
    <button id="start" onclick="startGame()">Jogar</button>
    <div class="notice" id="slow" hidden>
      Seu navegador est&aacute; desenhando o jogo sem a placa de v&iacute;deo, por isso ele fica lento.
      No Chrome ou Edge: Configura&ccedil;&otilde;es &rarr; Sistema &rarr; ligue
      &ldquo;Usar acelera&ccedil;&atilde;o de gr&aacute;ficos quando dispon&iacute;vel&rdquo; e reinicie o navegador.
      <button type="button" aria-label="Fechar" onclick="closeSlowNotice()">&times;</button>
    </div>
    <canvas
      class="backbuffer"
      id="canvas"
      oncontextmenu="event.preventDefault()"
      tabindex="0"
    ></canvas>
    <script type="text/javascript">
      var canvas = document.getElementById("canvas");
      // the game runs in threads: without them (an old browser, or the page
      // opened without https) it would stop on a blank screen
      var unsupported = !self.crossOriginIsolated || typeof SharedArrayBuffer === "undefined";
      function reportRuntimeError(prefix, error) {
        const payload = [prefix, error]
          .flat()
          .filter(Boolean)
          .map((entry) => {
            if (!entry) return "";
            if (typeof entry === "string") {
              return entry;
            }
            if (entry.stack) {
              return entry.stack;
            }
            try {
              return JSON.stringify(entry);
            } catch (_) {
              return String(entry);
            }
          })
          .join(": ");
        // once the game stopped, every later call repeats the same error
        if (payload === reportRuntimeError.last) return;
        reportRuntimeError.last = payload;
        console.error(payload);
        // stderr is only a message; the others stop the game
        if (prefix === "stderr") return;
        window.mythosStopped = true;
        const title = document.getElementById("title-text");
        if (title && !unsupported) {
          title.innerHTML = "O jogo parou com um erro. Recarregue a p&aacute;gina (F5) para voltar a jogar.";
        }
      }
      // a browser drawing without the graphics card (hardware acceleration
      // off, or a blocked driver) runs the game at a few frames per second
      function softwareRendering() {
        try {
          var gl = document.createElement("canvas").getContext("webgl2");
          if (!gl) return false;
          var info = gl.getExtension("WEBGL_debug_renderer_info");
          var renderer = info ? String(gl.getParameter(info.UNMASKED_RENDERER_WEBGL)) : "";
          var lose = gl.getExtension("WEBGL_lose_context");
          if (lose) lose.loseContext();
          if (/swiftshader|llvmpipe|softpipe|software|basic render/i.test(renderer)) return true;
          var strict = document.createElement("canvas").getContext("webgl2", { failIfMajorPerformanceCaveat: true });
          if (!strict) return true;
          lose = strict.getExtension("WEBGL_lose_context");
          if (lose) lose.loseContext();
          return false;
        } catch (e) {
          return false;
        }
      }
      // closed once, it stays closed in this browser
      function slowNoticeClosed() {
        try {
          return localStorage.getItem("mythos-slow-notice") === "closed";
        } catch (e) {
          return false;
        }
      }
      function closeSlowNotice() {
        document.getElementById("slow").hidden = true;
        try {
          localStorage.setItem("mythos-slow-notice", "closed");
        } catch (e) {}
      }
      if (!unsupported && !slowNoticeClosed() && softwareRendering()) {
        document.getElementById("slow").hidden = false;
      }
      function startGame() {
        document.getElementById("start").style.display = "none";
        // closing the tab by accident (Ctrl+W, the back button) asks first;
        // leaving the game from its own menu does not
        window.addEventListener("beforeunload", function (ev) {
          if (window.mythosLeaving || window.mythosStopped) return;
          ev.preventDefault();
          ev.returnValue = "";
        });
        callMain();
        document.addEventListener("touchstart", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
        });
        document.addEventListener("touchmove", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
        });
        document.addEventListener("touchend", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
        });
        document.addEventListener("keyup", function (ev) {
          if (window.mythosStopped) return;
          ev.preventDefault();
          ev.stopPropagation();
        });
        document.addEventListener("keydown", function (ev) {
          // the game stopped: the keys are the browser's again (F5 reloads)
          if (window.mythosStopped) return;
          if (
            !ev.ctrlKey &&
            ev.key !== "Enter" &&
            ev.key !== "Escape" &&
            ev.key !== "Backspace" &&
            ev.key !== "ArrowLeft" &&
            ev.key !== "ArrowRight" &&
            ev.key !== "ArrowUp" &&
            ev.key !== "ArrowDown"
          ) {
            canvas.dispatchEvent(new KeyboardEvent("keypress", ev));
          } else if (ev.ctrlKey && ev.key === "v") {
            return true;
          }
          ev.preventDefault();
          ev.stopPropagation();
        });
      }
      var Module = {
        locateFile: function (path) {
          const baseURL =
            window.location.origin +
            window.location.pathname.substring(
              0,
              window.location.pathname.lastIndexOf("/")
            );
          return baseURL + "/" + path;
        },
        preRun: [
          function () {
            addRunDependency("syncfs");
            if (!FS.analyzePath("/user").exists) FS.mkdir("/user");
            FS.mount(IDBFS, { autoPersist: true }, "/user");
            FS.syncfs(true, function (err) {
              if (err) {
                Module.print(err);
              }
              removeRunDependency("syncfs");
            });
          },
        ],
        postRun: [],
        print: (function () {
          return function (text) {
            text = Array.prototype.slice.call(arguments).join(" ");
            console.log(text);
          };
        })(),
        printErr: function () {
          reportRuntimeError("stderr", Array.prototype.slice.call(arguments).join(" "));
        },
        canvas: (function () {
          var canvas = document.getElementById("canvas");
          return canvas;
        })(),
        onAbort: function (reason) {
          reportRuntimeError("abort", reason || "unknown reason");
        },
        setStatus: function (text) {
          console.log("status: " + text);
          let display = "";
          if (text.includes("Running...")) {
            display = "";
            document.getElementById("start").style.display = "block";
          } else if (text.includes("Downloading data...")) {
            // "Downloading data... (12345/240000000)" -> "Baixando o jogo: 5%"
            const m = text.match(/\((\d+)\/(\d+)\)/);
            display = m ? "Baixando o jogo: " + Math.floor((100 * m[1]) / m[2]) + "%" : "Baixando o jogo...";
          }

          document.getElementById("title-text").innerHTML = display;
        },
        monitorRunDependencies: function (left) {
          console.log("monitor run deps: " + left);
          document.getElementById("title-text").innerHTML = "Preparando...";
        },
      };
      if (unsupported) {
        Module.setStatus = function () {};
        Module.monitorRunDependencies = function () {};
        document.getElementById("title-text").innerHTML =
          "Este navegador n&atilde;o consegue rodar o jogo. Use o Chrome, Edge ou Firefox atualizados, em https.";
      }
      window.onerror = function (message, source, lineno, colno, error) {
        reportRuntimeError("window.onerror", error || message);
      };
      window.addEventListener("unhandledrejection", function (event) {
        reportRuntimeError("unhandledrejection", event.reason || "Promise rejected");
      });
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
